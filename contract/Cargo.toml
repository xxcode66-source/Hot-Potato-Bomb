[package]
name = "potato"
version = "0.1.0"
edition = "2021"
description = "$POTATO Hot Potato Bomb - NEP-141 memecoin with on-chain mechanics (NEAR HACKATHON)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
